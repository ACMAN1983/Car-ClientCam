<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>極簡網頁截圖測試</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #f0f2f5; }
        .card { background: white; padding: 30px; border-radius: 15px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        #status { margin-top: 20px; color: #666; }
    </style>
</head>
<body>

<div class="card" id="capture-area">
    <h1>SENTINEL 系統測試</h1>
    <p>目前的測試時間: <span id="time"></span></p>
    <hr>
    <button onclick="captureAndUpload()">點擊截圖並傳送至 Google Drive</button>
</div>

<div id="status">準備就緒</div>

<script>
    // 🔴 請替換為您部署後的 GAS Web App URL
    const GAS_URL = "您的_GAS_部署網址_exec";

    // 顯示即時時間增加截圖辨識度
    setInterval(() => {
        document.getElementById('time').innerText = new Date().toLocaleString();
    }, 1000);

    async function captureAndUpload() {
        const status = document.getElementById('status');
        status.innerText = "正在擷取畫面...";

        try {
            // 1. 將指定的 HTML 元素轉為 Canvas
            const canvas = await html2canvas(document.body);
            
            // 2. 轉為 Base64 (使用 png 格式)
            const base64Image = canvas.toDataURL("image/png");

            status.innerText = "正在上傳雲端...";

            // 3. 傳送到 GAS
            const response = await fetch(GAS_URL, {
                method: "POST",
                body: JSON.stringify({ image: base64Image })
            });

            const result = await response.json();
            
            if (result.status === "成功") {
                status.innerText = "✅ 上傳成功！請檢查雲端資料夾。";
                console.log("檔案網址:", result.url);
            } else {
                status.innerText = "❌ 上傳失敗: " + result.error;
            }
        } catch (e) {
            status.innerText = "❌ 發生錯誤: " + e;
        }
    }
</script>

</body>
</html>
