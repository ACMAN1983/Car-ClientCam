<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UNIT TERMINAL v2.5</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    :root { --neon: #00f3ff; }
    body { background: #060b13; color: white; font-family: 'Orbitron', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100dvh; margin: 0; overflow: hidden; }
    .terminal-container { width: 95%; max-width: 420px; background: rgba(13, 20, 32, 0.95); border: 2px solid var(--neon); border-radius: 2rem; padding: 1.5rem; box-shadow: 0 0 30px rgba(0, 243, 255, 0.2); }
    #video-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 1rem; border: 1px solid rgba(0, 243, 255, 0.3); overflow: hidden; position: relative; margin-bottom: 1.5rem; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .mirror { transform: scaleX(-1); }
    .scan-line { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--neon); box-shadow: 0 0 10px var(--neon); animation: scan 4s linear infinite; pointer-events: none; }
    @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }
    select, button { font-family: 'Orbitron', sans-serif; }
    .neon-input { background: #0f172a; border: 1px solid #1e293b; color: var(--neon); }
    #status-log { font-family: monospace; background: rgba(0,0,0,0.5); border-left: 2px solid var(--neon); }
  </style>
</head>
<body>

  <div class="terminal-container">
    <div id="video-box">
      <div id="loading" class="absolute inset-0 flex items-center justify-center text-[10px] text-cyan-400 animate-pulse">SENSOR OFFLINE</div>
      <div id="scanner" class="scan-line hidden"></div>
      <video id="v" playsinline autoplay muted></video>
    </div>

    <div class="space-y-4">
      <h1 class="text-center font-black tracking-widest text-lg text-white">UNIT TERMINAL v2.5</h1>
      
      <div>
        <label class="text-[9px] text-slate-500 ml-1">UPLINK IDENTITY</label>
        <select id="carId" class="w-full neon-input p-3 rounded-xl text-sm font-bold appearance-none">
          <option value="RED-0938">RED-0938 (PRIMARY)</option>
          <option value="BLUE-1024">BLUE-1024</option>
        </select>
      </div>

      <div>
        <label class="text-[9px] text-slate-500 ml-1">SENSOR SOURCE</label>
        <select id="videoSource" class="w-full neon-input p-3 rounded-xl text-sm font-bold appearance-none">
          <option value="">SCANNING HARDWARE...</option>
        </select>
      </div>

      <button id="mainBtn" onclick="initSensor()" class="w-full py-4 bg-cyan-400 text-black font-black rounded-xl text-lg shadow-lg active:scale-95 uppercase mt-2">
        Initialize Link
      </button>

      <div id="status-log" class="p-2 rounded text-[9px] text-cyan-500 h-20 overflow-y-auto hidden whitespace-pre">>>> SYSTEM READY...</div>
    </div>
  </div>

  <script>
    // --- 重要：請將此網址替換為你最新的 GAS 部署 URL ---
    const GAS_URL = "https://script.google.com/macros/s/AKfycby4MYODd2hQ-J6JMLyzbgmNJDExluu62Alx1Ga725T9GwSJb5pmSsc07tCYagVnncSL/exec";
    
    let currentStream = null;

    // 列出鏡頭
    window.onload = async () => {
      try {
        await navigator.mediaDevices.getUserMedia({ video: true });
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');
        const sel = document.getElementById('videoSource');
        sel.innerHTML = '';
        videoDevices.forEach((d, i) => sel.add(new Option(d.label || `Camera ${i+1}`, d.deviceId)));
      } catch (e) { alert("Camera Scanner Error"); }
    };

    async function initSensor() {
      const deviceId = document.getElementById('videoSource').value;
      const carId = document.getElementById('carId').value;
      if (currentStream) currentStream.getTracks().forEach(t => t.stop());

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { deviceId: { exact: deviceId } } 
        });
        currentStream = stream;
        const v = document.getElementById('v');
        v.srcObject = stream;
        
        // 鏡像判斷
        if (stream.getVideoTracks()[0].label.toLowerCase().includes('front')) v.classList.add('mirror');
        else v.classList.remove('mirror');

        document.getElementById('loading').style.display = 'none';
        document.getElementById('scanner').classList.remove('hidden');
        document.getElementById('status-log').classList.remove('hidden');
        
        const btn = document.getElementById('mainBtn');
        btn.innerText = "LINK ACTIVE";
        btn.classList.replace('bg-cyan-400', 'bg-slate-800');
        btn.classList.add('text-cyan-400');
        
        startGps(carId);
      } catch (e) { alert("Init Error: " + e.message); }
    }

    function startGps(carId) {
      navigator.geolocation.watchPosition(pos => {
        const payload = {
          carId: carId,
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          speed: pos.coords.speed ? (pos.coords.speed * 3.6).toFixed(1) : 0,
          accuracy: Math.round(pos.coords.accuracy)
        };

        // 發送數據 (no-cors 模式)
        fetch(GAS_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload)
        });

        const log = document.getElementById('status-log');
        log.innerText += `\nSYNC: ${payload.lat.toFixed(4)}, ${payload.lng.toFixed(4)}`;
        log.scrollTop = log.scrollHeight;
      }, null, { enableHighAccuracy: true });
    }
  </script>
</body>
</html>
