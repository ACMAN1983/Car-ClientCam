<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AEGIS UNIT TERMINAL v3.5 29 版 (2026年4月6日凌晨1:37)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');
    :root { --neon: #00f3ff; --warn: #f43f5e; }
    body { background: #020617; color: white; font-family: 'Orbitron', sans-serif; margin: 0; overflow: hidden; display: flex; justify-content: center; min-height: 100dvh; }
    
    .terminal-container { 
      width: 100%; max-width: 450px; background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      padding: 1rem; display: flex; flex-direction: column; border-left: 1px solid rgba(0, 243, 255, 0.2); border-right: 1px solid rgba(0, 243, 255, 0.2);
    }

    /* 頂部相機小視窗 */
    #cam-preview { 
      width: 100%; height: 120px; border-radius: 1rem; overflow: hidden; position: relative; border: 1px solid rgba(0, 243, 255, 0.3); margin-bottom: 1rem;
    }
    video { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }

    /* 核心時速錶儀表 */
    .speed-gauge {
      position: relative; width: 240px; height: 240px; margin: 0 auto;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border: 4px double var(--neon); border-radius: 50%; box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
      background: rgba(0,0,0,0.3);
    }
    .speed-value { font-size: 80px; font-weight: 900; line-height: 1; color: var(--neon); text-shadow: 0 0 15px var(--neon); font-family: 'Orbitron', sans-serif; }
    .speed-unit { font-size: 14px; color: #94a3b8; letter-spacing: 2px; margin-top: -5px; }

    /* HUD 數據顯示 */
    .hud-data { font-family: 'Rajdhani', sans-serif; font-size: 13px; color: #38bdf8; letter-spacing: 1px; }

    /* 掃描線動畫 */
    .scan-line { position: absolute; width: 100%; height: 4px; background: rgba(0, 243, 255, 0.2); animation: scan 3s linear infinite; pointer-events: none; }
    @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }

    .neon-select { background: #1e293b; border: 1px solid #334155; color: var(--neon); width: 100%; padding: 12px; border-radius: 8px; font-size: 14px; outline: none; }
    #status-log { font-family: 'Courier New', monospace; font-size: 10px; color: #2dd4bf; background: rgba(0,0,0,0.6); padding: 8px; height: 60px; overflow-y: auto; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="terminal-container">
    <div id="cam-preview">
      <div class="scan-line"></div>
      <video id="v" playsinline autoplay muted></video>
      <div class="absolute top-2 left-2 text-[8px] bg-cyan-950/80 px-2 py-1 rounded border border-cyan-500">LIVE FEED</div>
    </div>

    <div class="flex-1 flex flex-col items-center justify-around py-4">
      <div class="speed-gauge">
        <div id="current-speed" class="speed-value">0</div>
        <div class="speed-unit">KM/H</div>
      </div>

      <div class="grid grid-cols-2 gap-8 w-full px-4 hud-data text-center">
        <div>
          <div class="text-[10px] text-slate-500 uppercase">Latitude</div>
          <div id="disp-lat">0.000000</div>
        </div>
        <div>
          <div class="text-[10px] text-slate-500 uppercase">Longitude</div>
          <div id="disp-lng">0.000000</div>
        </div>
      </div>
    </div>

    <div class="space-y-4 bg-slate-900/50 p-4 rounded-2xl border border-slate-800">
      <div class="flex gap-2">
        <div class="flex-1">
          <select id="carId" class="neon-select">
            <option>DETECTING UNIT...</option>
          </select>
        </div>
        <div class="flex-1">
          <select id="videoSource" class="neon-select">
            <option value="">CAM SCAN...</option>
          </select>
        </div>
      </div>

      <button id="mainBtn" onclick="initAegis()" class="w-full py-4 bg-cyan-500 text-black font-black rounded-xl text-lg shadow-[0_0_15px_rgba(6,182,212,0.5)] active:scale-95 transition-all">
        ACTIVATE AEGIS LINK
      </button>

      <div id="status-log">>>> INITIALIZING SYSTEM...</div>
    </div>
  </div>

  <script>
    // 🔴 請確保填入正確的 GAS 部署網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbycJyZih8ppEksbDy4VZxKh5BEgYOe_8iku8-69iWdWB27o6EsOJM-PQpe1Az6zj1SFQ/exec";
    let currentStream = null;

    window.onload = async () => {
      // 1. 偵測相機
      try {
        await navigator.mediaDevices.getUserMedia({ video: true });
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');
        const sel = document.getElementById('videoSource');
        sel.innerHTML = '';
        videoDevices.forEach((d, i) => sel.add(new Option(d.label || `CAM ${i+1}`, d.deviceId)));
      } catch (e) { document.getElementById('status-log').innerText += "\n> CAM ERR"; }

      // 2. 偵測 Google Sheets 分頁
      try {
        const response = await fetch(`${GAS_URL}?action=getSheets`);
        const sheetNames = await response.json();
        const carSelect = document.getElementById('carId');
        carSelect.innerHTML = '';
        sheetNames.forEach(name => carSelect.add(new Option(name, name)));
        document.getElementById('status-log').innerText += "\n> HUB CONNECTED";
      } catch (e) {
        document.getElementById('status-log').innerText += "\n> HUB ERR";
      }
    };

    async function initAegis() {
      const devId = document.getElementById('videoSource').value;
      const carId = document.getElementById('carId').value;
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: devId } } });
        document.getElementById('v').srcObject = stream;
        
        document.getElementById('mainBtn').innerText = "SYSTEM ONLINE";
        document.getElementById('mainBtn').classList.replace('bg-cyan-500', 'bg-slate-800');
        document.getElementById('mainBtn').classList.add('text-cyan-500');
        
        startTacticalLink(carId);
      } catch (e) { alert("INIT FAILED"); }
    }

    function startTacticalLink(carId) {
      navigator.geolocation.watchPosition(pos => {
        const speedKmh = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
        
        // 更新 UI
        document.getElementById('current-speed').innerText = speedKmh;
        document.getElementById('disp-lat').innerText = pos.coords.latitude.toFixed(6);
        document.getElementById('disp-lng').innerText = pos.coords.longitude.toFixed(6);

        const payload = {
          carId: carId,
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          speed: speedKmh,
          accuracy: Math.round(pos.coords.accuracy)
        };

        // 背景同步到 GS
        fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });

        const log = document.getElementById('status-log');
        log.innerText += `\n[${new Date().toLocaleTimeString()}] SYNC OK`;
        log.scrollTop = log.scrollHeight;
      }, null, { enableHighAccuracy: true });
    }
  </script>
</body>
</html>
