<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>UNIT TERMINAL v4.0 VISION</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    :root { --neon: #00f3ff; }
    body { background: #020617; color: white; font-family: 'Orbitron', sans-serif; margin: 0; overflow: hidden; display: flex; justify-content: center; min-height: 100dvh; }
    .terminal-container { width: 100%; max-width: 450px; background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); padding: 1rem; display: flex; flex-direction: column; }
    #cam-preview { width: 100%; height: 220px; border-radius: 1rem; overflow: hidden; position: relative; border: 2px solid rgba(0, 243, 255, 0.3); flex-shrink: 0; }
    video { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }
    canvas#snapshot { display: none; }
    .speed-gauge { width: 200px; height: 200px; margin: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 4px double var(--neon); border-radius: 50%; box-shadow: 0 0 20px rgba(0, 243, 255, 0.15); }
    .speed-value { font-size: 70px; font-weight: 900; line-height: 1; color: var(--neon); text-shadow: 0 0 10px var(--neon); }
    .neon-select { background: #111827; border: 1px solid #374151; color: var(--neon); width: 100%; padding: 10px; border-radius: 8px; font-size: 12px; outline: none; }
    #status-log { font-family: monospace; font-size: 10px; color: #2dd4bf; background: rgba(0,0,0,0.5); padding: 8px; height: 50px; overflow-y: auto; border-radius: 4px; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="terminal-container">
    <div id="cam-preview">
      <video id="v" playsinline autoplay muted></video>
      <div class="absolute top-2 left-2 text-[8px] bg-black/60 px-2 py-1 rounded border border-cyan-500">AEGIS VISION v4.0</div>
      <canvas id="snapshot"></canvas>
    </div>
    <div class="flex-1 flex flex-col justify-center">
      <div class="speed-gauge">
        <div id="current-speed" class="speed-value">0</div>
        <div class="text-[10px] text-slate-500 tracking-widest font-bold uppercase">km/h</div>
      </div>
      <div class="grid grid-cols-2 gap-4 w-full mt-6 text-center text-[11px] text-cyan-600 font-bold">
        <div>LAT: <span id="disp-lat" class="text-white">0.0000</span></div>
        <div>LNG: <span id="disp-lng" class="text-white">0.0000</span></div>
      </div>
    </div>
    <div class="space-y-3 bg-gray-900/40 p-4 rounded-xl border border-gray-800">
      <div class="flex gap-2">
        <select id="carId" class="neon-select"><option>DETECTION UNIT...</option></select>
        <select id="videoSource" class="neon-select"><option value="">CAM SCAN...</option></select>
      </div>
      <button id="mainBtn" onclick="initAegis()" class="w-full py-4 bg-cyan-500 text-black font-black rounded-lg text-sm shadow-lg active:scale-95 transition-all uppercase">Engage Link</button>
      <div id="status-log">>>> LINK STANDBY...</div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyQi8ekgjn_zBAPw3zmLVetaISOmxfR9mSjzSEAz0-bj4Dc5vmSowylLSsgx0XueGzs/exec";
    let currentStream = null;

    window.onload = async () => {
      try {
        await navigator.mediaDevices.getUserMedia({ video: true });
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');
        const vSel = document.getElementById('videoSource');
        vSel.innerHTML = '';
        videoDevices.forEach((d, i) => vSel.add(new Option(d.label || `CAM ${i+1}`, d.deviceId)));

        const response = await fetch(`${GAS_URL}?action=getSheets`);
        const sheetNames = await response.json();
        const carSel = document.getElementById('carId');
        carSel.innerHTML = '';
        sheetNames.forEach(name => carSel.add(new Option(name, name)));
        document.getElementById('status-log').innerText = ">>> HUB READY.";
      } catch (e) { document.getElementById('status-log').innerText = ">>> CONNECTION ERR."; }
    };

    async function initAegis() {
      const devId = document.getElementById('videoSource').value;
      const carId = document.getElementById('carId').value;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: devId } } });
        document.getElementById('v').srcObject = stream;
        document.getElementById('mainBtn').innerText = "LINK ACTIVE";
        document.getElementById('mainBtn').disabled = true;
        document.getElementById('mainBtn').style.background = "#1f2937";
        startTracking(carId);
      } catch (e) { alert("INIT FAILED"); }
    }

    function startTracking(carId) {
      navigator.geolocation.watchPosition(pos => {
        const speedKmh = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
        document.getElementById('current-speed').innerText = speedKmh;
        document.getElementById('disp-lat').innerText = pos.coords.latitude.toFixed(4);
        document.getElementById('disp-lng').innerText = pos.coords.longitude.toFixed(4);

        const video = document.getElementById('v');
        const canvas = document.getElementById('snapshot');
        canvas.width = 640; canvas.height = 480;
        canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
        const base64 = canvas.toDataURL("image/jpeg", 0.6);

        fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({
            data: { carId, lat: pos.coords.latitude, lng: pos.coords.longitude, speed: speedKmh, accuracy: pos.coords.accuracy },
            imageString: base64
          })
        }).then(res => res.json()).then(res => {
           if(res.status === "SUCCESS") document.getElementById('status-log').innerText += `\n[${new Date().toLocaleTimeString()}] UPLINK OK`;
        });
      }, null, { enableHighAccuracy: true });
    }
  </script>
</body>
</html>
